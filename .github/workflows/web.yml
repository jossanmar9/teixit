# Publica la web de presentació (GitHub Pages) cada vegada que canvia el codi o la documentació
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construeix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Teixit s'ha integrat en Compàs 2.0: la web només envia a la de Compàs
      - name: Prepara la pàgina de redirecció
        run: |
          cp -r eines/web-final _site
          cp app/assets/icona.png _site/icona.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publica:
    needs: construeix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplega.outputs.page_url }}
    steps:
      - id: desplega
        uses: actions/deploy-pages@v4
