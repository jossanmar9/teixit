; Configuració de PHP per a Teixit (Windows)
; extension_dir i error_log els indica el llançador amb rutes absolutes.

[PHP]
engine = On
expose_php = Off
memory_limit = 256M
max_execution_time = 120
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
default_charset = "UTF-8"
output_buffering = 4096

extension = pdo_sqlite
extension = sqlite3
extension = mbstring
extension = fileinfo
; xifrat de les còpies externes (libsodium.dll va al costat de php.exe)
extension = sodium

[Date]
date.timezone = Europe/Madrid

[Session]
session.use_strict_mode = 1
session.cookie_httponly = 1
; Teixit no la fa servir; desactivada per seguretat (CVE-2026-109619)
session.upload_progress.enabled = 0
session.gc_maxlifetime = 28800
session.gc_probability = 1
session.gc_divisor = 100

[opcache]
; opcache accelera el programa si l'extensió està disponible
zend_extension = opcache
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
