; Configuració del llançador de Teixit
; Després de canviar-la, tanca i torna a obrir Teixit.

; Port on s'obri Teixit (http://localhost:PORT). Canvia'l només si un altre programa ja l'utilitza.
port = 8750

; 1 = obri el navegador automàticament en arrancar
navegador = 1

; 1 = obri Teixit en la seua finestra, sense navegador (amb el component WebView2 de Windows).
;     En tancar-la, es fa la còpia de seguretat i Teixit s'atura.
; 0 = obri el navegador habitual i mostra la finestra menuda de Teixit, com abans.
finestra = 1
